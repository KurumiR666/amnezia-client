name: 'Build Android APK'

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

env:
  QT_MIRROR: https://mirrors.ocf.berkeley.edu/qt/
  QT_VERSION: '6.10.3'
  QT_MODULES: 'qtremoteobjects qt5compat qtimageformats qtshadertools'
  ANDROID_PLATFORM: android-30
  NDK_VERSION: 27.0.11718014
  APP_ANDROID_MIN_SDK: 30

jobs:
  build-apk:
    name: 'Build Android APK (arm64-v8a)'
    runs-on: ubuntu-24.04

    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: 'Setup Java 17'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 'Setup Android SDK & NDK'
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;${{ env.ANDROID_PLATFORM }} ndk;${{ env.NDK_VERSION }}"

      - name: 'Setup Python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 'Install Conan and build tools'
        run: |
          pip install "conan==2.28.0" ninja

      - name: 'Install desktop Qt'
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: ${{ env.QT_MODULES }}
          dir: ${{ runner.temp }}
          py7zrversion: '==0.22.*'
          extra: '--base ${{ env.QT_MIRROR }}'

      - name: 'Install android_arm64_v8a Qt'
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: 'all_os'
          target: 'android'
          arch: 'android_arm64_v8a'
          modules: ${{ env.QT_MODULES }}
          dir: ${{ runner.temp }}
          py7zrversion: '==0.22.*'
          extra: '--base ${{ env.QT_MIRROR }}'

      - name: 'Generate Debug Keystore'
        shell: bash
        run: |
          keytool -genkeypair -v -keystore android.keystore \
            -alias amnezia-debug -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass amnezia123 -keypass amnezia123 \
            -dname "CN=Amnezia, OU=Dev, O=Amnezia, L=City, S=State, C=US"

      - name: 'Build project'
        env:
          QT_INSTALL_DIR: ${{ runner.temp }}
          QT_ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android.keystore
          QT_ANDROID_KEYSTORE_ALIAS: 'amnezia-debug'
          QT_ANDROID_KEYSTORE_STORE_PASS: 'amnezia123'
          PROD_AGW_PUBLIC_KEY: |
            -----BEGIN PUBLIC KEY-----
            MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAwMJbYlGxn3l+0XiGA9I/
            BHK8HX/aet7A9GVL817apDUeL6sdISRBdopv5Y0FdrBHSJWSUdWtVxVazJB46J8x
            327/5H5pi0nkfRbcgxBGSGxhKOvwRe+WPVb2f81jlkenZK46c9C7dNmX/310rlHY
            BwOnZcdw2oKu6hTNDwk3nyUo2v2/leNIMLsv84RlHAX6Tyx5slq8ysewhcmdfv17
            WQjF7albq12ZafTSjtXqDcsrk2oF8mfyzxLjSXbxQHKIDHkfz3SUXCs/H9tt1ydK
            2Yj6nIxv98HESZ8Ng40OZPhHDex8Ru1NjcWlo2EWNM1xT8IqmBT21PLuyzGjNSwG
            Ojnm1V2EcjerVmRNhFTJG70RkURD/i2MDbG+ZKpqPtW1uL8wEt2IkSqNfKcf+TF+
            UJZZfm1lDUMpWJ2eWJGrgOUX8/f8v/GB+x4PxUo1m7V/pDLqCUPm3l2dkaM9P0sM
            6lO0+jKqfIFnG1zjc3if7r1YbDsZlyl389q9Hrh7t+Lwj/JXkDxFaTnudM8egaXk
            GX5YxZiEDmCCLRskRwBBUaYffXIpFbI8sO2Xj0J5/im5xtu7TtfJktcPzDL9uyG1
            Ebt8oSA4FTzTid6Zwj55YgDfz0FMnNmXh80T1xMzlbi6y+BCuna+I+7McMRo8yz3
            VzzYJ0/J7PpHpXoZv7K1qDsCAwEAAQ==
            -----END PUBLIC KEY-----
          PROD_S3_ENDPOINT: 'https://s3.eu-north-1.amazonaws.com/amnezia/'
          FALLBACK_S3_ENDPOINT: 'https://storage.googleapis.com/lambda-list/,https://storage.mwsapis.ru/lambda-list/,https://s3.cloudruserapi.net/lambda-list/'
        shell: bash
        run: |
          chmod +x deploy/build.sh
          deploy/build.sh -t android --sign --abi arm64-v8a --build ./deploy/build/arm64-v8a

      - name: 'Upload APK'
        uses: actions/upload-artifact@v4
        with:
          name: AmneziaVPN-arm64-v8a
          path: deploy/build/**/*.apk
          if-no-files-found: error
